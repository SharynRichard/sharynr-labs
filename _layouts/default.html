<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">

    <style>
      body,
      .markdown-body,
      button, input, select, textarea {
        font-family: 'IBM Plex Sans', sans-serif;
      }
      pre {
      position: relative;
      }
      .copy-code-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      }
      .copy-code-btn:hover {
      background: #eef1f4;
      }
    </style>
  </head>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("pre").forEach((block) => {
      const button = document.createElement("button");
      button.className = "copy-code-btn";
      button.innerText = "Copy";

      button.addEventListener("click", () => {
        const code = block.querySelector("code") ? block.querySelector("code").innerText : block.innerText;
        navigator.clipboard.writeText(code).then(() => {
          button.innerText = "Copied!";
          setTimeout(() => { button.innerText = "Copy"; }, 2000);
        });
      });

      block.appendChild(button);
    });
  });
</script>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {{ content }}
    </div>
    <script src="https://cloudflare.com" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
  </body>
</html>
